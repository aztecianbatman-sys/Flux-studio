name: Flux Studio Windows Build

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  package-windows:
    name: Build Windows x64 installer
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip
          python -m pip install aqtinstall==3.3.0 py7zr==1.1.0
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 --outputdir "$env:RUNNER_TEMP\Qt"

      - name: Configure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qt = Join-Path $env:RUNNER_TEMP 'Qt\6.8.3\msvc2022_64'
          if (-not (Test-Path $qt)) { throw "Qt not found: $qt" }
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$qt"

      - name: Build Release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build build --config Release --parallel 2 -- /m:2

      - name: Verify executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:GITHUB_WORKSPACE 'build\Release\Flux Studio.exe'
          if (-not (Test-Path $exe)) { throw "Build output missing: $exe" }
          Write-Host "Built $exe"
          Get-Item $exe | Select-Object FullName,Length,LastWriteTime

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item 'build\Release\Flux Studio.exe' 'dist\Flux Studio.exe'
          $windeploy = Join-Path $env:RUNNER_TEMP 'Qt\6.8.3\msvc2022_64\bin\windeployqt.exe'
          if (-not (Test-Path $windeploy)) { throw "windeployqt not found: $windeploy" }
          & $windeploy --release --compiler-runtime --no-translations 'dist\Flux Studio.exe'
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed with exit code $LASTEXITCODE" }

      - name: Install NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install nsis --no-progress --yes

      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (-not (Test-Path $nsis)) { throw "NSIS not found: $nsis" }
          & $nsis /V2 'packaging\windows\installer.nsi'
          if ($LASTEXITCODE -ne 0) { throw "NSIS failed with exit code $LASTEXITCODE" }
          $installer = 'Flux-Studio-0.8.0-Windows-x64-Setup.exe'
          if (-not (Test-Path $installer)) { throw "Installer missing: $installer" }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Compress-Archive -Path 'dist\*' -DestinationPath 'Flux-Studio-0.8.0-Windows-x64-Portable.zip' -Force

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Flux-Studio-0.8.0-Windows-x64-Installer
          path: Flux-Studio-0.8.0-Windows-x64-Setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: Flux-Studio-0.8.0-Windows-x64-Portable
          path: Flux-Studio-0.8.0-Windows-x64-Portable.zip
          if-no-files-found: error
          retention-days: 14
