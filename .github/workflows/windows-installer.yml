name: Build Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flux-studio-windows-installer
  cancel-in-progress: true

jobs:
  package-windows:
    name: Build Flux Studio Windows x64
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtsvg
          cache: true
          aqtversion: '==3.3.*'

      - name: Configure CMake
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_PREFIX_PATH="$env:Qt6_DIR"

      - name: Build Release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build build --config Release --parallel 2

      - name: Stage application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:GITHUB_WORKSPACE 'build\Release\Flux Studio.exe'
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Flux Studio executable was not produced: $exe"
          }

          New-Item -ItemType Directory -Force -Path 'dist' | Out-Null
          Copy-Item -LiteralPath $exe -Destination 'dist\Flux Studio.exe'

          $windeploy = Join-Path $env:Qt6_DIR '..\..\bin\windeployqt.exe'
          $windeploy = [System.IO.Path]::GetFullPath($windeploy)
          if (-not (Test-Path -LiteralPath $windeploy)) {
            throw "windeployqt.exe was not found: $windeploy"
          }

          & $windeploy --release --compiler-runtime --no-translations --no-system-d3d-compiler 'dist\Flux Studio.exe'
          if ($LASTEXITCODE -ne 0) {
            throw "windeployqt failed with exit code $LASTEXITCODE"
          }

          New-Item -ItemType Directory -Force -Path 'dist\runtime' | Out-Null
          @'
Flux Studio 0.6.0 - Windows x64

Qt runtime is bundled with this build.
Audio/video import and encoding features require FFmpeg/FFprobe separately available on PATH.
'@ | Set-Content -Encoding UTF8 -Path 'dist\runtime\README.txt'

      - name: Install NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install nsis --no-progress --yes

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (-not (Test-Path -LiteralPath $nsis)) {
            throw "makensis.exe was not found: $nsis"
          }

          & $nsis /V2 'packaging\windows\installer.nsi'
          if ($LASTEXITCODE -ne 0) {
            throw "NSIS failed with exit code $LASTEXITCODE"
          }

          $installer = Join-Path $env:GITHUB_WORKSPACE 'Flux-Studio-0.6.0-Windows-x64-Setup.exe'
          if (-not (Test-Path -LiteralPath $installer)) {
            throw "Installer was not produced: $installer"
          }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Compress-Archive -Path 'dist\*' -DestinationPath 'Flux-Studio-0.6.0-Windows-x64-Portable.zip' -Force

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Flux-Studio-0.6.0-Windows-x64-Installer
          path: Flux-Studio-0.6.0-Windows-x64-Setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: Flux-Studio-0.6.0-Windows-x64-Portable
          path: Flux-Studio-0.6.0-Windows-x64-Portable.zip
          if-no-files-found: error
          retention-days: 14
