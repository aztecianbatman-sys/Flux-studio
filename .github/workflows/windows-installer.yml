name: Build Windows Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: ''
          cache: true
          cache-key-prefix: flux-studio-qt-windows-x64
          add-tools-to-path: true

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Stage application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $exe = Join-Path $env:GITHUB_WORKSPACE 'build\Release\Flux Studio.exe'
          if (!(Test-Path $exe)) {
            throw "Flux Studio executable was not produced: $exe"
          }
          Copy-Item $exe 'dist\Flux Studio.exe'

          $windeploy = Get-Command windeployqt.exe -ErrorAction SilentlyContinue
          if (!$windeploy) {
            throw 'windeployqt.exe could not be located on PATH.'
          }
          & $windeploy.Source --release --compiler-runtime --no-translations 'dist\Flux Studio.exe'
          if ($LASTEXITCODE -ne 0) {
            throw "windeployqt failed with exit code $LASTEXITCODE"
          }

          New-Item -ItemType Directory -Force -Path 'dist\runtime' | Out-Null
          @'
Flux Studio 0.6.0 — Windows x64

Qt runtime is bundled with this build.
Audio/video import and encoding features require FFmpeg/FFprobe separately available on PATH.
'@ | Set-Content -Path 'dist\runtime\README.txt'

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (!(Test-Path $nsis)) {
            throw "makensis.exe not found: $nsis"
          }
          & $nsis 'packaging\windows\installer.nsi'
          if ($LASTEXITCODE -ne 0) {
            throw "NSIS failed with exit code $LASTEXITCODE"
          }
          $installer = Join-Path $env:GITHUB_WORKSPACE 'Flux-Studio-0.6.0-Windows-x64-Setup.exe'
          if (!(Test-Path $installer)) {
            throw "Installer was not produced: $installer"
          }

      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path 'dist\*' -DestinationPath 'Flux-Studio-0.6.0-Windows-x64-Portable.zip' -Force

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flux-Studio-0.6.0-Windows-x64-Installer
          path: Flux-Studio-0.6.0-Windows-x64-Setup.exe
          if-no-files-found: error

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flux-Studio-0.6.0-Windows-x64-Portable
          path: Flux-Studio-0.6.0-Windows-x64-Portable.zip
          if-no-files-found: error
